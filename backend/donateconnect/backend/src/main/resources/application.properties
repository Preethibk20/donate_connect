server.port=${SERVER_PORT:8080}

# Data Source Configuration (Defaults to in-memory H2 if DB_URL is not set)
spring.datasource.url=${DB_URL:jdbc:h2:mem:donateconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# JWT Configuration (24 Hours Expiration = 86400000 ms)
app.jwt.secret=${JWT_SECRET:donateConnectSecretKeyMustBeAtLeast32BytesLongForHS256Security!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Application Name
spring.application.name=DonateConnect Backend
