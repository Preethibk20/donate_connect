spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Data Source Configuration (Defaults to in-memory H2 if DB_URL is not set)
spring.datasource.url=${DB_URL:jdbc:h2:mem:donateconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}

# JWT Configuration (24 Hours Expiration = 86400000 ms)
# IMPORTANT: JWT_SECRET must be set via environment variable - no default allowed in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Spring Mail (Brevo SMTP)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_KEY}
app.mail.from=${BREVO_SENDER_EMAIL:noreply@donateconnect.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Local File Storage
# Uploaded donation photos are stored under this directory (relative to working dir)
app.storage.upload-dir=${UPLOAD_DIR:uploads/}
# Maximum allowed upload file size per file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# CORS Configuration
# Comma-separated list of allowed origins for the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Application Name
spring.application.name=DonateConnect Backend
